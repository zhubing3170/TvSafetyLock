org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 在线题库地址（留空则不启用在线更新，只用内置题库）
# 本地打包：填你自己 GitHub 仓库里 question-bank/questions.json 的 raw 地址，例如
# questionBankUrl=https://raw.githubusercontent.com/zhubing3170/TvSafetyLock/main/question-bank/questions.json
# 用 GitHub Actions 打包时，workflow 会用 -PquestionBankUrl 自动覆盖成当前仓库地址，不用手动填。
questionBankUrl=
# 备用地址（国内电视访问 GitHub raw 经常不通，建议填 jsDelivr CDN）：
# questionBankUrlMirror=https://cdn.jsdelivr.net/gh/zhubing3170/TvSafetyLock@main/question-bank/questions.json
# GitHub Actions 同样会自动注入，本地打包才需要手动填。
questionBankUrlMirror=
